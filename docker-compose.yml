services:
  db:
    image: postgres:16-alpine  
    container_name: all_chats
    environment:
      POSTGRES_USER: ${DB_USER}  
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME} 
    ports:
      - ${DB_PORT}:${DB_PORT}  
    volumes:
      - postgres_data:/var/lib/postgresql/data 

volumes:
  postgres_data: