services:
  db:
    image: postgres:16-alpine  
    container_name: all_chats
    environment:
      POSTGRES_USER: sandesh       
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: langgraph_chat  
    ports:
      - "5432:5432"  
    volumes:
      - postgres_data:/var/lib/postgresql/data 

volumes:
  postgres_data: